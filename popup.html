<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>GitHub Topic Spam Filter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Blocked GitHub Usernames</h1>

    <div class="input-row">
      <input
        id="usernameInput"
        type="text"
        placeholder="Enter GitHub username"
      />

      <button id="addButton">
        Add
      </button>
    </div>

    <ul id="userList"></ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
